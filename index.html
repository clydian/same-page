<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#014653" />
    <script>
      // Restore display preferences before the first paint, including offline starts.
      try {
        const owner = localStorage.getItem("same-page:appearance-owner") || "guest";
        const value = JSON.parse(localStorage.getItem("same-page:appearance:" + owner) || "null") || {};
        const dark = value.interfaceTheme === "dark" || value.interfaceTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches;
        const selected = dark ? value.darkPaper : value.lightPaper;
        document.documentElement.dataset.uiTheme = dark ? "dark" : "light";
        document.documentElement.dataset.paperTheme = ["original", "soft", "inverted"].includes(selected) ? selected : dark ? "soft" : "original";
        document.documentElement.dataset.invertAnnotations = String(value.invertAnnotations === true);
      } catch { /* Browser storage is optional. */ }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <meta
      name="description"
      content="合谱 Same Page，为合唱排练与共享批注打造的乐谱云盘。"
    />
    <meta name="apple-mobile-web-app-title" content="合谱" />
    <title>合谱 · Same Page</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
