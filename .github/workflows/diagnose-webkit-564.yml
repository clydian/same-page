name: Diagnose WebKit 564
on:
  push:
    branches: [codex/diagnose-webkit-564]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: node .github/scripts/verify-browsers.mjs
      - run: node .github/diagnostics/webkit-564-run.mjs
      - name: Preserve every diagnostic result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue-564-${{ matrix.sample }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/verification/
          retention-days: 14
