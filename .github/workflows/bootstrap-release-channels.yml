name: Prepare release channel bridge

# Preparation only. Enabling routing requires separate mobile acceptance.
on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful main CI run sealing this exact workflow source
        required: true
        type: string
      legacy_run:
        description: Successful main CI run sealing the supported production baseline
        required: true
        type: string
      legacy_sha:
        description: Full SHA of the supported production baseline
        required: true
        type: string
      confirmation:
        description: Confirm this main workflow's full source SHA
        required: true
        type: string

permissions: {}

env:
  CI_RUN_ID: ${{ inputs.ci_run }}
  LEGACY_RUN_ID: ${{ inputs.legacy_run }}
  LEGACY_SHA: ${{ inputs.legacy_sha }}
  RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
  CHANNEL_ROUTING_ENABLED: ${{ vars.RELEASE_CHANNELS_ENABLED }}

jobs:
  validate:
    if: github.repository == 'clydian/same-page' && github.ref == 'refs/heads/main' && vars.RELEASE_CHANNELS_ENABLED != 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: control
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - name: Checkout trusted main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checked-out controls
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/control"

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: Validate source CI and legacy artifact identities
        id: validation
        run: node scripts/bootstrap-release.mjs validate "$RUNNER_TEMP/bootstrap-handoff/plan.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download original source ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.validation.outputs.source_artifact_id }}
          repository: clydian/same-page
          run-id: ${{ inputs.ci_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bootstrap-source-incoming
          skip-decompress: true
          digest-mismatch: error

      - name: Download original legacy ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.validation.outputs.legacy_artifact_id }}
          repository: clydian/same-page
          run-id: ${{ inputs.legacy_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bootstrap-legacy-incoming
          skip-decompress: true
          digest-mismatch: error

      - name: Verify original ZIP bytes and sealed release inventories
        run: |
          node scripts/bootstrap-release.mjs stage "$RUNNER_TEMP/bootstrap-handoff/plan.json" source "$RUNNER_TEMP/bootstrap-source-incoming" "$RUNNER_TEMP/bootstrap-handoff/source.zip"
          node scripts/bootstrap-release.mjs stage "$RUNNER_TEMP/bootstrap-handoff/plan.json" legacy "$RUNNER_TEMP/bootstrap-legacy-incoming" "$RUNNER_TEMP/bootstrap-handoff/legacy.zip"
          node scripts/bootstrap-release.mjs extract "$RUNNER_TEMP/bootstrap-handoff/plan.json" "$RUNNER_TEMP/bootstrap-handoff/source.zip" "$RUNNER_TEMP/bootstrap-handoff/legacy.zip" "$RUNNER_TEMP/bootstrap-source" "$RUNNER_TEMP/bootstrap-legacy"

      - name: Install trusted locked compatibility tools
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify preinstalled compatibility browsers
        timeout-minutes: 1
        run: node .github/scripts/verify-browsers.mjs

      - name: Verify actual legacy and bridge storage transitions
        run: |
          node scripts/bootstrap-release.mjs transition "$RUNNER_TEMP/bootstrap-handoff/plan.json" "$RUNNER_TEMP/bootstrap-source" "$RUNNER_TEMP/bootstrap-legacy"
          cp artifacts/verification/bootstrap-transition.json "$RUNNER_TEMP/bootstrap-handoff/transition.json"

      - name: Transfer verified original ZIPs and preparation plan
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bootstrap-handoff/
          if-no-files-found: error
          retention-days: 1

      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: control/artifacts/verification/
          if-no-files-found: ignore
          retention-days: 14

  production:
    needs: validate
    if: github.repository == 'clydian/same-page' && github.ref == 'refs/heads/main' && vars.RELEASE_CHANNELS_ENABLED != 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    timeout-minutes: 30
    concurrency:
      group: same-page-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: control
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checked-out controls
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/control"

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: Download this run's verified handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/bootstrap-handoff
          digest-mismatch: error

      - name: Recheck both original ZIPs and sealed release inventories
        run: node scripts/bootstrap-release.mjs extract "$RUNNER_TEMP/bootstrap-handoff/plan.json" "$RUNNER_TEMP/bootstrap-handoff/source.zip" "$RUNNER_TEMP/bootstrap-handoff/legacy.zip" "$RUNNER_TEMP/bootstrap-source" "$RUNNER_TEMP/bootstrap-legacy"

      - name: Install trusted locked publication tools
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm ci --prefix android --prefer-offline --no-audit --no-fund

      - name: Verify preinstalled publication browsers
        timeout-minutes: 1
        run: node .github/scripts/verify-browsers.mjs

      - name: Verify unchanged production baseline and private release storage
        run: |
          node scripts/bootstrap-release.mjs preflight "$RUNNER_TEMP/bootstrap-handoff/plan.json" "$RUNNER_TEMP/bootstrap-source" "$RUNNER_TEMP/bootstrap-legacy"
          cd "$RUNNER_TEMP/bootstrap-source"
          node "$GITHUB_WORKSPACE/control/scripts/frontend-release.mjs" preflight "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Admit bridge under the production lock
        id: admission
        run: node scripts/bootstrap-release.mjs admit "$RUNNER_TEMP/bootstrap-handoff/plan.json" "$RUNNER_TEMP/bootstrap-source"

      - name: Archive supported legacy resources before replacing root assets
        working-directory: ${{ runner.temp }}/bootstrap-legacy
        run: node "$GITHUB_WORKSPACE/control/scripts/frontend-release.mjs" archive-legacy "$LEGACY_SHA" --archive-supported-baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Stage immutable bridge frontend without changing pointers
        working-directory: ${{ runner.temp }}/bootstrap-source
        run: node "$GITHUB_WORKSPACE/control/scripts/frontend-release.mjs" upload "$GITHUB_SHA" --initialize-stable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy original bridge artifact with routing disabled
        working-directory: ${{ runner.temp }}/bootstrap-source
        run: node "$GITHUB_WORKSPACE/control/node_modules/wrangler/bin/wrangler.js" deploy --config dist/same_page/wrangler.json --var RELEASE_CHANNELS_ENABLED:false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production against the original bridge manifest
        working-directory: ${{ runner.temp }}/bootstrap-source
        run: node "$GITHUB_WORKSPACE/control/scripts/verify-deployment.mjs" https://samepage.clyapps.com "$GITHUB_SHA" dist/client/build.json

      - name: Initialize identical stable and beta targets after verification
        working-directory: ${{ runner.temp }}/bootstrap-source
        run: node "$GITHUB_WORKSPACE/control/scripts/frontend-release.mjs" initialize "$GITHUB_SHA" --initialize-stable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify online channel bridge and browser installation
        run: node scripts/verify-bootstrap-online.mjs "$GITHUB_SHA"

      - name: Record mobile acceptance boundary
        run: |
          echo "Bridge $GITHUB_SHA prepared with stable = beta; runtime routing remains false." >> "$GITHUB_STEP_SUMMARY"
          echo "Normal main deployment remains frozen. Real iOS PWA and Android TWA acceptance is required before enabling routing." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control/artifacts/verification/
            ${{ runner.temp }}/bootstrap-handoff/plan.json
            ${{ runner.temp }}/bootstrap-handoff/transition.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Record release result
        if: always() && steps.admission.outputs.deployment_id != ''
        run: node scripts/bootstrap-release.mjs status "$RUNNER_TEMP/bootstrap-handoff/plan.json"
        env:
          DEPLOYMENT_ID: ${{ steps.admission.outputs.deployment_id }}
          RELEASE_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
