name: Browser stability experiment

# Explicit, bounded experiments; ordinary PR pushes do not pay for ten runs.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Bounded integration scenario to repeat (no browser physics assertions)
        type: choice
        default: navigation-offline
        options:
          - navigation-offline
          - reader-touch
          - practice-reopen
          - xml-original-save
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  repeat:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'browser-stability'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify preinstalled browser environment
        timeout-minutes: 1
        run: node .github/scripts/verify-browsers.mjs
      - run: npm run build
        env:
          # Match main CI's channel-capable artifact for this release regression.
          SAME_PAGE_RELEASE_CHANNELS: ${{ inputs.scenario == 'practice-reopen' && '1' || '' }}
      # checkout trusts the workspace in a temporary HOME. The experiment's
      # identity capture runs in the job HOME, like production admission.
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Consecutive runs of the selected scenario
        shell: bash
        env:
          STABILITY_SCENARIO: ${{ inputs.scenario || 'navigation-offline' }}
        run: |
          mkdir -p artifacts/stability
          git rev-parse HEAD > artifacts/stability/commit.txt
          node --version > artifacts/stability/node.txt
          cp /etc/os-release artifacts/stability/os-release.txt
          npx playwright --version > artifacts/stability/playwright.txt
          attempts=10
          case "$STABILITY_SCENARIO" in
            navigation-offline)
              test_args=(visual-report/drive-navigation.test.mjs browser-tests/offline-entry-smoke.test.mjs)
              ;;
            reader-touch)
              test_args=(--test-name-pattern='continuous native touch|continuous touch pinch' visual-report/reader-immersive.test.mjs)
              ;;
            practice-reopen|xml-original-save)
              test_args=(--test-name-pattern='^webkit: MusicXML startup prepared-reopen$' browser-tests/musicxml-startup.test.mjs)
              attempts=30
              ;;
            *) echo "Unknown stability scenario" >&2; exit 1 ;;
          esac
          printf '%s\n' "$STABILITY_SCENARIO" > artifacts/stability/scenario.txt
          failed=0
          for attempt in $(seq 1 "$attempts"); do
            started=$(date +%s)
            status=0
            node --test --test-reporter=tap --test-concurrency=1 \
              "${test_args[@]}" \
              > "artifacts/stability/run-${attempt}.log" 2>&1 || status=$?
            duration=$(( $(date +%s) - started ))
            printf '%s\t%s\t%s\n' "$attempt" "$status" "$duration" >> artifacts/stability/results.tsv
            if [ -d artifacts/verification ]; then
              mv artifacts/verification "artifacts/stability/evidence-${attempt}"
            fi
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          cat artifacts/stability/results.tsv >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-stability-${{ github.run_id }}
          path: artifacts/stability/
          retention-days: 14
